<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padel-Craft OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --n0:#060F1C;--n1:#0B1C30;--n2:#0F2540;--n3:#163050;--n4:#1E3D62;
  --w:#fff;--w2:rgba(255,255,255,.85);--w3:rgba(255,255,255,.55);--w4:rgba(255,255,255,.25);--w5:rgba(255,255,255,.08);
  --f:'Montserrat',sans-serif;--amber:#E8C07A;--danger:#E07A6A;--ok:#8FB8E8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--n1);color:var(--w);font-family:var(--f);font-size:15px;font-weight:300;line-height:1.5;min-height:100%}
a{color:inherit}
button,select,input,textarea{font-family:var(--f)}
.topbar{height:34px;background:var(--n0);border-bottom:1px solid var(--w5);display:flex;align-items:center;justify-content:flex-end;gap:18px;padding:0 4%;font-size:10.5px;letter-spacing:.08em;color:var(--w3);font-weight:500}
.topbar a{color:var(--w3);text-decoration:none}
nav{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 4%;border-bottom:1px solid var(--w5);background:rgba(6,15,28,.97);position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:baseline;text-decoration:none}
.lp{font-weight:300;letter-spacing:.22em;text-transform:uppercase;font-size:15px}
.ls{color:var(--w4);margin:0 4px;font-size:15px}
.lc{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:15px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid transparent;color:var(--w3);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:8px 12px;border-radius:1px;cursor:pointer}
.tabs button.on,.tabs button:hover{color:var(--w);border-color:var(--w4);background:rgba(255,255,255,.06)}
.who{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--w3);font-weight:600}
main{padding:28px 4% 64px;max-width:1280px;margin:0 auto}
.view{display:none}
.view.on{display:block}
.kicker{display:flex;align-items:center;gap:10px;font-size:10px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--w3);margin-bottom:12px}
.kicker:before{content:"";width:28px;height:1px;background:var(--w4)}
h1{font-size:clamp(22px,3vw,34px);font-weight:800;text-transform:uppercase;letter-spacing:-.02em;line-height:.97;margin-bottom:8px}
h1 em{font-style:normal;display:block;color:var(--w2)}
.sub{color:var(--w3);font-weight:300;max-width:640px;margin-bottom:28px;line-height:1.7}
.row{display:grid;gap:10px;margin-bottom:16px}
.row.k4{grid-template-columns:repeat(4,1fr)}
.row.k5{grid-template-columns:repeat(5,1fr)}
.kpi{background:var(--n0);border:1px solid var(--w5);padding:16px 16px;border-radius:1px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
.kpi .l{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--w3);margin-top:6px}
.kpi.warn .v{color:var(--amber)}
.kpi.bad .v{color:var(--danger)}
.band{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--w3);margin:18px 0 10px}
.cols{display:grid;gap:10px}
.cols.c4{grid-template-columns:repeat(4,1fr)}
.cols.c6{grid-template-columns:repeat(6,1fr)}
.col h3{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--w3);font-weight:700;margin-bottom:8px}
.card{border:1px solid var(--w5);background:var(--n2);padding:10px 12px;border-radius:1px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--w4)}
.card .t{font-weight:700;font-size:13px}
.card .m{font-size:11px;color:var(--w3);margin-top:3px}
.card.red{border-color:rgba(224,122,106,.45);background:rgba(224,122,106,.1)}
.card.amber{border-color:rgba(232,192,122,.35);background:rgba(232,192,122,.08)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--w3);font-weight:700;padding:8px 8px 8px 0;border-bottom:1px solid var(--w4)}
td{padding:10px 8px 10px 0;border-bottom:1px solid var(--w5);vertical-align:top;font-weight:400;color:var(--w2)}
.tag{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--w5);padding:3px 8px;border-radius:1px;color:var(--w3)}
.road{display:grid;grid-template-columns:360px 1fr;gap:32px;align-items:start}
.phone{border:1px solid var(--w4);background:var(--n0);border-radius:2px;overflow:hidden;max-width:360px}
.pbar{background:var(--n0);border-bottom:1px solid var(--w5);padding:12px 14px;display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.pbody{padding:14px}
.btn{display:block;width:100%;text-align:center;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:12px 8px;margin-bottom:6px;border-radius:1px;border:1px solid var(--w5);background:transparent;color:var(--w3);cursor:pointer}
.btn.pri{background:var(--w);color:var(--n0);border-color:transparent}
.btn.sm{display:inline-block;width:auto;padding:6px 10px;margin:6px 6px 0 0;font-size:9px}
.panel{background:var(--n2);border:1px solid var(--w5);padding:18px;border-radius:1px}
label{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--w3);margin:12px 0 6px}
input,select,textarea{width:100%;background:var(--n0);border:1px solid var(--w5);color:var(--w);padding:10px 12px;border-radius:1px;font-size:13px}
textarea{min-height:72px;resize:vertical}
.toast{position:fixed;bottom:24px;right:24px;background:var(--w);color:var(--n0);padding:12px 18px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:1px;display:none;z-index:50}
.toast.on{display:block}
.empty{color:var(--w4);font-size:12px;padding:8px 0}
@media(max-width:900px){
  .row.k4,.row.k5,.cols.c4,.cols.c6,.road{grid-template-columns:1fr}
  .tabs{display:none}
  .mtabs{display:flex;overflow-x:auto;gap:4px;padding:8px 4%;border-bottom:1px solid var(--w5)}
}
@media(min-width:901px){.mtabs{display:none}}
</style>
</head>
<body>
<div class="topbar">
  <a href="https://www.padel-craft.com/">padel-craft.com</a>
  <span>Internal OS · v0.1 prototype</span>
</div>
<nav>
  <a class="logo" href="#"><span class="lp">Padel</span><span class="ls">·</span><span class="lc">Craft</span></a>
  <div class="tabs" id="tabs"></div>
  <div class="who">Founder A · on the road</div>
</nav>
<div class="mtabs" id="mtabs"></div>
<main>
  <section class="view on" id="v-road"></section>
  <section class="view" id="v-command"></section>
  <section class="view" id="v-tenders"></section>
  <section class="view" id="v-blockers"></section>
  <section class="view" id="v-install"></section>
  <section class="view" id="v-forecast"></section>
</main>
<div class="toast" id="toast"></div>
<script>
const VIEWS = [
  ["road","Road"],
  ["command","Command"],
  ["tenders","Tenders"],
  ["blockers","Blockers"],
  ["install","Install 90"],
  ["forecast","Forecast"]
];

const state = {
  sold: { lastQ: 18, lastWeek: 2, thisWeek: 1, projectedQ: 9 },
  forecast: { nextQ: 14, y12: 52, backlog: 48, undated: 6 },
  nextSite: { t: "Club B · visit 14:00", m: "Direct · 2 courts · next stop" },
  calls: [
    { t: "Leisure C · Aoife", m: "Inbound 09:12 · call back on price", cls: "amber" },
    { t: "Operator A · site 3", m: "Follow up today · proposal", cls: "" }
  ],
  blockers: [
    { id: 1, t: "Council RFT · bid/no-bid", m: "Tender · closes in 9 days · Founder A", type: "Tender", sev: "Red", status: "Open", founder: true },
    { id: 2, t: "Site X unpaid install?", m: "Cash · override? · Founder B", type: "Cash", sev: "Red", status: "Open", founder: true },
    { id: 3, t: "MANZA not ordered · Site X", m: "Material · due Fri · Michael", type: "Material", sev: "Red", status: "Open", founder: false },
    { id: 4, t: "Crew partial · week 38", m: "Crew · flex Paul?", type: "Crew", sev: "Amber", status: "Open", founder: false },
    { id: 5, t: "Club D undated close", m: "Date Expected close or park", type: "Sales", sev: "Amber", status: "Open", founder: true }
  ],
  tenders: {
    "Initial contact": [{ t: "County leisure · 6", m: "Portal notice · qualify this week" }],
    "Qualifying": [{ t: "Hotel group · 4", m: "Site + budget · visit Wed" }],
    "Bid / no-bid": [{ t: "Council framework", m: "Closes 9 days · Founder A", cls: "red" }],
    "Initial document out": [{ t: "Local authority · 8", m: "Pack due Thu · Carys", cls: "amber" }],
    "Secondary document out": [{ t: "Leisure chain · 12", m: "BAFO due 22 Sep · Founder B" }],
    "Award": [{ t: "Won → Verbal then Booked", m: "Lost keeps the pack" }]
  },
  installs: [
    ["36","Club H",2,"Install","Covered · Michael + 2","On site","—"],
    ["37","Hotel F",1,"Coordination","Covered · Paul flex","Ordered · ETA W36","—"],
    ["38","Site X",2,"Coordination","Partial · 1 of 3","Not ordered","Red · kit + crew"],
    ["40","Club G",2,"Procurement","Unassigned","Ordered","Red · deposit"],
    ["42–43","Operator A site 2",4,"Pre-contract","Unassigned","Not ordered","Amber · window TBC"]
  ],
  pipeline: [
    ["Operator A site 3","Direct","Proposal",4,"40%","1.6","This Q"],
    ["Hotel F","Direct","Verbal",1,"70%","0.7","This Q"],
    ["Local authority","Tender","Initial document out",8,"25%","2.0","Next Q"],
    ["Leisure chain","Tender","Secondary document out",12,"45%","5.4","Next Q"],
    ["Club D","Direct","Proposal",4,"40%","—","Undated · leak"]
  ],
  form: { account: "", kind: "Client inbound", said: "", raise: false }
};

function el(id){ return document.getElementById(id); }
function toast(msg){ const t=el("toast"); t.textContent=msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),2200); }
function cards(list){ return list.length ? list.map(c=>`<div class="card ${c.cls||""}"><div class="t">${c.t}</div><div class="m">${c.m}</div></div>`).join("") : `<div class="empty">None</div>`; }

function renderNav(){
  const html = VIEWS.map(([id,l])=>`<button data-v="${id}">${l}</button>`).join("");
  el("tabs").innerHTML = html;
  el("mtabs").innerHTML = html;
  document.querySelectorAll(".tabs button, .mtabs button").forEach(b=>{
    b.onclick = ()=>show(b.dataset.v);
  });
}
function show(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  el("v-"+id).classList.add("on");
  document.querySelectorAll(".tabs button, .mtabs button").forEach(b=>b.classList.toggle("on", b.dataset.v===id));
  window.scrollTo(0,0);
}

function myRed(){ return state.blockers.filter(b=>b.status==="Open" && b.sev==="Red" && b.founder); }
function openBlockers(){ return state.blockers.filter(b=>b.status!=="Cleared"); }

function renderRoad(){
  el("v-road").innerHTML = `
    <div class="kicker">00 · Between sites</div>
    <h1>The phone holds the day<em>Three cards. Four buttons. Then drive.</em></h1>
    <p class="sub">Log the call, take the client update, triage your red blockers, see the next site. Desk Command waits for Monday.</p>
    <div class="road">
      <div class="phone">
        <div class="pbar"><span>Padel-Craft · Road</span><span>Founder A</span></div>
        <div class="pbody">
          <div class="col"><h3>Next site</h3>${cards([state.nextSite])}</div>
          <div class="col"><h3>Calls to return</h3>${cards(state.calls)}</div>
          <div class="col"><h3>My red blockers</h3>${cards(myRed().map(b=>({t:b.t,m:b.m,cls:"red"})))}</div>
          <button class="btn pri" onclick="show('blockers')">Triage blockers</button>
        </div>
      </div>
      <div class="panel">
        <div class="kicker" style="margin-bottom:8px">Log in 20 seconds</div>
        <h3 style="text-transform:uppercase;letter-spacing:.08em;font-size:13px;margin-bottom:8px">Call or client update</h3>
        <label>Account</label>
        <input id="f-acc" placeholder="Club, operator, council…" value="${state.form.account}">
        <label>Kind</label>
        <select id="f-kind">
          <option>Client inbound</option>
          <option>Founder call</option>
          <option>Site update</option>
        </select>
        <label>What they said</label>
        <textarea id="f-said" placeholder="Two sentences max">${state.form.said}</textarea>
        <label><input type="checkbox" id="f-raise" style="width:auto;margin-right:8px"> Raise a sales blocker</label>
        <button class="btn pri" style="margin-top:16px" onclick="logCall()">Log it</button>
        <p class="sub" style="margin:14px 0 0;font-size:12px">Driving? Voice-note the OS inbox. Carys files this same form within an hour. Do not batch Sunday.</p>
      </div>
    </div>`;
}

function logCall(){
  const acc = el("f-acc").value.trim() || "Unknown account";
  const kind = el("f-kind").value;
  const said = el("f-said").value.trim() || "Update logged from the road";
  const raise = el("f-raise").checked;
  state.calls.unshift({ t: acc + " · " + kind, m: said, cls: raise ? "red" : "amber" });
  if (raise) {
    state.blockers.unshift({ id: Date.now(), t: acc + " · from call", m: said, type: "Sales", sev: "Red", status: "Open", founder: true });
  }
  el("f-acc").value = ""; el("f-said").value = ""; el("f-raise").checked = false;
  toast(raise ? "Logged · blocker raised" : "Call logged");
  renderAll();
  show("road");
}

function renderCommand(){
  const s = state.sold, f = state.forecast;
  const red = openBlockers().filter(b=>b.sev==="Red").length;
  const packs = 2, unres = 3, kit = 2;
  el("v-command").innerHTML = `
    <div class="kicker">01 · Monday desk</div>
    <h1>Command<em>Sold, forecast, tenders, blockers, installs.</em></h1>
    <p class="sub">Ten minutes. Act from the cards. No side lists.</p>
    <div class="band">Sold — courts booked</div>
    <div class="row k4">
      <div class="kpi"><div class="v">${s.lastQ}</div><div class="l">Last quarter</div></div>
      <div class="kpi"><div class="v">${s.lastWeek}</div><div class="l">Last week</div></div>
      <div class="kpi"><div class="v">${s.thisWeek}</div><div class="l">This week</div></div>
      <div class="kpi warn"><div class="v">${s.projectedQ}</div><div class="l">Projected this quarter</div></div>
    </div>
    <div class="band">Forecast — weighted, dated close only</div>
    <div class="row k4">
      <div class="kpi"><div class="v">${f.nextQ}</div><div class="l">Next quarter weighted</div></div>
      <div class="kpi"><div class="v">${f.y12}</div><div class="l">Next 12 months weighted</div></div>
      <div class="kpi"><div class="v">${f.backlog}</div><div class="l">Sold not installed</div></div>
      <div class="kpi bad"><div class="v">${f.undated}</div><div class="l">Undated leak · courts</div></div>
    </div>
    <div class="band">Triage</div>
    <div class="row k4">
      <div class="kpi bad"><div class="v">${red}</div><div class="l">Red blockers</div></div>
      <div class="kpi warn"><div class="v">${packs}</div><div class="l">Tender packs due this week</div></div>
      <div class="kpi bad"><div class="v">${unres}</div><div class="l">Installs in 90d unresourced</div></div>
      <div class="kpi warn"><div class="v">${kit}</div><div class="l">Materials not ordered</div></div>
    </div>
    <div class="cols c4">
      <div class="col"><h3>Blockers · red first</h3>${cards(openBlockers().slice(0,3).map(b=>({t:b.t,m:b.m,cls:b.sev==="Red"?"red":"amber"})))}</div>
      <div class="col"><h3>Tenders · next document</h3>${cards([{t:"Local authority · 8",m:"Initial pack due Thu",cls:"amber"},{t:"Leisure chain · 12",m:"Secondary pack due 22 Sep"},{t:"Hotel group · 4",m:"Qualifying · visit Wed"}])}</div>
      <div class="col"><h3>Install 90 · notify</h3>${cards([{t:"Club H · week 36",m:"Crew covered · kit on site"},{t:"Site X · week 38",m:"Partial crew · kit not ordered",cls:"red"},{t:"Club G · week 40",m:"Deposit overdue",cls:"amber"}])}</div>
      <div class="col"><h3>Forecast movers</h3>${cards([{t:"Operator A · 4 · 40%",m:"Direct proposal · this Q · 1.6 wtd"},{t:"Council · 8 · 25%",m:"Initial doc out · next Q · 2.0 wtd"},{t:"Club D · 4 · undated",m:"Date the close or park it",cls:"amber"}])}</div>
    </div>`;
}

function renderTenders(){
  const cols = Object.entries(state.tenders).map(([name,list])=>`
    <div class="col"><h3>${name}</h3>${cards(list)}</div>`).join("");
  el("v-tenders").innerHTML = `
    <div class="kicker">03 · Tender desk</div>
    <h1>Two document gates<em>Initial pack out. Secondary pack out.</em></h1>
    <p class="sub">Large material tenders from first contact through award. Bid/no-bid is a founder field. Carys does not draft on Pending.</p>
    <div class="cols c6">${cols}</div>`;
}

function renderBlockers(){
  const rows = openBlockers().map(b=>`
    <tr>
      <td><strong style="color:var(--w)">${b.t}</strong><div style="color:var(--w3);font-size:12px;margin-top:4px">${b.m}</div></td>
      <td><span class="tag">${b.type}</span></td>
      <td style="color:${b.sev==="Red"?"var(--danger)":"var(--amber)"};font-weight:700">${b.sev}</td>
      <td>
        <button class="btn sm" onclick="triage(${b.id},'Waiting on other')">Waiting</button>
        <button class="btn sm pri" onclick="triage(${b.id},'Cleared')">Clear</button>
      </td>
    </tr>`).join("");
  el("v-blockers").innerHTML = `
    <div class="kicker">04 · Triage</div>
    <h1>Identify. Assign. Clear.<em>If it is not on this list, Command does not know it exists.</em></h1>
    <p class="sub">Red with founder action first. Clearing is a status change, not a chat message.</p>
    <table>
      <thead><tr><th>Blocker</th><th>Type</th><th>Severity</th><th>Act</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="4" class="empty">All clear</td></tr>`}</tbody>
    </table>`;
}

function triage(id, status){
  const b = state.blockers.find(x=>x.id===id);
  if(!b) return;
  b.status = status;
  toast(status === "Cleared" ? "Blocker cleared" : "Waiting on other");
  renderAll();
  show("blockers");
}

function renderInstall(){
  const rows = state.installs.map(r=>`<tr>${r.map((c,i)=>`<td${i===6&&c.startsWith("Red")?` style="color:var(--danger);font-weight:700"`:""}>${c}</td>`).join("")}</tr>`).join("");
  el("v-install").innerHTML = `
    <div class="kicker">05 · Next 90 days</div>
    <h1>How the installs are going<em>Crew. Materials ordered or not. Windows.</em></h1>
    <p class="sub">Every live project whose install window overlaps the next 90 days. Founders notify from here; Michael fills crew and kit.</p>
    <div class="row k5">
      <div class="kpi"><div class="v">7</div><div class="l">Projects in 90 days</div></div>
      <div class="kpi"><div class="v">14</div><div class="l">Courts in those windows</div></div>
      <div class="kpi"><div class="v">4</div><div class="l">Crew covered</div></div>
      <div class="kpi bad"><div class="v">3</div><div class="l">Crew partial / none</div></div>
      <div class="kpi warn"><div class="v">2</div><div class="l">Kit not ordered</div></div>
    </div>
    <table>
      <thead><tr><th>Week</th><th>Project</th><th>Courts</th><th>Stage</th><th>Crew</th><th>Materials</th><th>Blocker</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function renderForecast(){
  const rows = state.pipeline.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("");
  el("v-forecast").innerHTML = `
    <div class="kicker">02 · Pipeline</div>
    <h1>What will sell<em>This quarter, next quarter, twelve months.</em></h1>
    <p class="sub">Weighted courts from live deals with a dated Expected close. Undated rows are a leak — they do not inflate the 12-month number.</p>
    <div class="row k4">
      <div class="kpi warn"><div class="v">${state.sold.projectedQ}</div><div class="l">Projected this quarter</div></div>
      <div class="kpi"><div class="v">${state.forecast.nextQ}</div><div class="l">Next quarter weighted</div></div>
      <div class="kpi"><div class="v">${state.forecast.y12}</div><div class="l">Next 12 months weighted</div></div>
      <div class="kpi bad"><div class="v">${state.forecast.undated}</div><div class="l">Undated leak · courts</div></div>
    </div>
    <table>
      <thead><tr><th>Deal</th><th>Path</th><th>Stage</th><th>Courts</th><th>Weight</th><th>Wtd courts</th><th>Close</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function renderAll(){
  renderRoad(); renderCommand(); renderTenders(); renderBlockers(); renderInstall(); renderForecast();
}
renderNav();
renderAll();
show("road");
</script>
</body>
</html>

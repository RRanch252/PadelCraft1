<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padel-Craft OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --n0:#060F1C;--n1:#0B1C30;--n2:#0F2540;--n3:#163050;--n4:#1E3D62;
  --w:#fff;--w2:rgba(255,255,255,.85);--w3:rgba(255,255,255,.55);--w4:rgba(255,255,255,.25);--w5:rgba(255,255,255,.08);
  --f:'Montserrat',sans-serif;--amber:#E8C07A;--danger:#E07A6A;--ok:#8FB8E8;
  --paper:#F4F1EA;--ink:#0B1C30;--mute:#5C6570;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--n1);color:var(--w);font-family:var(--f);font-size:15px;font-weight:300;line-height:1.5;min-height:100%}
a{color:inherit}
button,select,input,textarea{font-family:var(--f)}
.topbar{height:34px;background:var(--n0);border-bottom:1px solid var(--w5);display:flex;align-items:center;justify-content:flex-end;gap:18px;padding:0 4%;font-size:10.5px;letter-spacing:.08em;color:var(--w3);font-weight:500}
.topbar a{color:var(--w3);text-decoration:none}
nav{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 4%;border-bottom:1px solid var(--w5);background:rgba(6,15,28,.97);position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:baseline;text-decoration:none}
.lp{font-weight:300;letter-spacing:.22em;text-transform:uppercase;font-size:15px}
.ls{color:var(--w4);margin:0 4px;font-size:15px}
.lc{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:15px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid transparent;color:var(--w3);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:8px 8px;border-radius:1px;cursor:pointer}
.tabs button.on,.tabs button:hover{color:var(--w);border-color:var(--w4);background:rgba(255,255,255,.06)}
.who{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--w3);font-weight:600}
main{padding:28px 4% 64px;max-width:1280px;margin:0 auto}
.view{display:none}
.view.on{display:block}
.kicker{display:flex;align-items:center;gap:10px;font-size:10px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--w3);margin-bottom:12px}
.kicker:before{content:"";width:28px;height:1px;background:var(--w4)}
h1{font-size:clamp(22px,3vw,34px);font-weight:800;text-transform:uppercase;letter-spacing:-.02em;line-height:.97;margin-bottom:8px}
h1 em{font-style:normal;display:block;color:var(--w2)}
.sub{color:var(--w3);font-weight:300;max-width:720px;margin-bottom:28px;line-height:1.7}
.row{display:grid;gap:10px;margin-bottom:16px}
.row.k2{grid-template-columns:1.3fr .7fr}
.row.k3{grid-template-columns:repeat(3,1fr)}
.row.k4{grid-template-columns:repeat(4,1fr)}
.row.k5{grid-template-columns:repeat(5,1fr)}
.kpi{background:var(--n0);border:1px solid var(--w5);padding:16px;border-radius:1px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
.kpi .l{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--w3);margin-top:6px}
.kpi.warn .v{color:var(--amber)}
.kpi.bad .v{color:var(--danger)}
.band{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--w3);margin:18px 0 10px}
.cols{display:grid;gap:10px}
.cols.c2{grid-template-columns:280px 1fr}
.cols.c4{grid-template-columns:repeat(4,1fr)}
.cols.c6{grid-template-columns:repeat(6,1fr)}
.col h3{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--w3);font-weight:700;margin-bottom:8px}
.card{border:1px solid var(--w5);background:var(--n2);padding:10px 12px;border-radius:1px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--w4)}
.card .t{font-weight:700;font-size:13px}
.card .m{font-size:11px;color:var(--w3);margin-top:3px}
.card.red{border-color:rgba(224,122,106,.45);background:rgba(224,122,106,.1)}
.card.amber{border-color:rgba(232,192,122,.35);background:rgba(232,192,122,.08)}
.card.on{border-color:var(--w);background:var(--n3)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--w3);font-weight:700;padding:8px 8px 8px 0;border-bottom:1px solid var(--w4)}
td{padding:10px 8px 10px 0;border-bottom:1px solid var(--w5);vertical-align:top;font-weight:400;color:var(--w2)}
.tag{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--w5);padding:3px 8px;border-radius:1px;color:var(--w3)}
.road{display:grid;grid-template-columns:360px 1fr;gap:32px;align-items:start}
.phone{border:1px solid var(--w4);background:var(--n0);border-radius:2px;overflow:hidden;max-width:360px}
.pbar{background:var(--n0);border-bottom:1px solid var(--w5);padding:12px 14px;display:flex;justify-content:space-between;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.pbody{padding:14px}
.btn{display:block;width:100%;text-align:center;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:12px 8px;margin-bottom:6px;border-radius:1px;border:1px solid var(--w5);background:transparent;color:var(--w3);cursor:pointer}
.btn.pri{background:var(--w);color:var(--n0);border-color:transparent}
.btn.sm{display:inline-block;width:auto;padding:6px 10px;margin:6px 6px 0 0;font-size:9px}
.panel{background:var(--n2);border:1px solid var(--w5);padding:18px;border-radius:1px}
label{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--w3);margin:12px 0 6px}
input,select,textarea{width:100%;background:var(--n0);border:1px solid var(--w5);color:var(--w);padding:10px 12px;border-radius:1px;font-size:13px}
textarea{min-height:72px;resize:vertical}
.toast{position:fixed;bottom:24px;right:24px;background:var(--w);color:var(--n0);padding:12px 18px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:1px;display:none;z-index:50}
.toast.on{display:block}
.empty{color:var(--w4);font-size:12px;padding:8px 0}
.paper{background:var(--paper);color:var(--ink);padding:22px 24px;border-radius:1px;margin-bottom:16px}
.paper h3{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin:0 0 4px;color:var(--ink)}
.paper .note{font-size:11.5px;color:var(--mute);font-weight:400;margin:0 0 14px;line-height:1.45;max-width:none}
.paper svg{display:block;max-width:100%;height:auto}
.paper table th{color:#5C6570;border-bottom-color:rgba(11,28,48,.25)}
.paper table td{color:#0B1C30;border-bottom-color:rgba(11,28,48,.12);font-weight:400}
.paper .heat th{color:#5C6570;border:none;text-align:center;font-size:8.5px;letter-spacing:.06em;padding:4px 2px;font-weight:600}
.paper .heat td{text-align:center;font-size:9px;font-weight:600;padding:5px 2px;border:1px solid rgba(11,28,48,.08)}
.paper .heat td.lab{text-align:left;border:none;padding-left:0;font-size:10px;color:#0B1C30}
.kpi{cursor:default}
.fb{border-top:1px solid var(--w5);padding:10px 0}
.fb .who{color:var(--amber);margin-bottom:4px}
.fb p{color:var(--w2);font-size:13px;font-weight:400}
@media(max-width:900px){
  .row.k2,.row.k3,.row.k4,.row.k5,.cols.c2,.cols.c4,.cols.c6,.road{grid-template-columns:1fr}
  .tabs{display:none}
  .mtabs{display:flex;overflow-x:auto;gap:4px;padding:8px 4%;border-bottom:1px solid var(--w5)}
}
@media(min-width:901px){.mtabs{display:none}}
</style>
</head>

let state = JSON.parse(JSON.stringify(defaults));
let horizon = 12;
try {
  const saved = JSON.parse(localStorage.getItem("pcos-v2") || "null");
  if (saved) {
    if (saved.drafts && saved.drafts[0] && saved.drafts[0].lines) state.drafts = saved.drafts;
    if (saved.blockers) state.blockers = saved.blockers;
    if (saved.calls) state.calls = saved.calls;
    if (saved.selectedDraft) state.selectedDraft = saved.selectedDraft;
    if (saved.horizon === 6 || saved.horizon === 12) horizon = saved.horizon;
  }
} catch (e) {}

function persist(){ localStorage.setItem("pcos-v2", JSON.stringify({ drafts: state.drafts, blockers: state.blockers, calls: state.calls, selectedDraft: state.selectedDraft, horizon })); }
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c])); }
function eur(n){ const s = n<0?"−":""; return s+"€"+Math.abs(Math.round(n)).toLocaleString("en-IE"); }
function eurk(n){ const s = n<0?"−":""; return s+"€"+Math.abs(Math.round(n/1000))+"k"; }
function toast(msg){ const t=el("toast"); t.textContent=msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),2200); }
function cards(list){ return list.length ? list.map(c=>`<div class="card ${c.cls||""}"><div class="t">${esc(c.t)}</div><div class="m">${esc(c.m)}</div></div>`).join("") : `<div class="empty">None</div>`; }

function renderNav(){
  const html = VIEWS.map(([id,l])=>`<button data-v="${id}">${l}</button>`).join("");
  el("tabs").innerHTML = html;
  el("mtabs").innerHTML = html;
  document.querySelectorAll(".tabs button, .mtabs button").forEach(b => { b.onclick = () => show(b.dataset.v); });
}
function show(id){
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  el("v-"+id).classList.add("on");
  document.querySelectorAll(".tabs button, .mtabs button").forEach(b => b.classList.toggle("on", b.dataset.v===id));
  window.scrollTo(0,0);
}
function myRed(){ return state.blockers.filter(b => b.status==="Open" && b.sev==="Red" && b.founder); }
function openBlockers(){ return state.blockers.filter(b => b.status!=="Cleared"); }

function clubMetrics(){
  const c = state.club;
  const n = c.courts;
  let booked = 0, avail = 0, rev = 0, playerH = 0;
  const byDay = c.days.map((day, di) => {
    let b = 0, r = 0, p = 0;
    c.heat[di].forEach((u, hi) => {
      const hours = n * u / 100;
      b += hours;
      r += hours * c.rate[hi];
      p += hours * c.ppc[hi];
    });
    const a = n * c.hours.length;
    booked += b; avail += a; rev += r; playerH += p;
    const used = b;
    return {
      day, booked: b, avail: a, util: b / a, rev: r, adr: r / b,
      ppc: p / b, staff: c.fohHours[di] / used, wait: c.waitlist[di],
      coaches: c.coachHours[di] / used
    };
  });
  return {
    byDay,
    util: booked / avail,
    adr: rev / booked,
    revpach: rev / avail,
    ppc: playerH / booked,
    staff: c.fohHours.reduce((a,b)=>a+b,0) / booked,
    rev, booked, avail,
    wait: c.waitlist.reduce((a,b)=>a+b,0),
    gmvCourtMo: (rev * 52 / 12) / n
  };
}

}

function svgGantt(rows, title){
  const n = horizon;
  const left = 150, top = 28, rowH = 26, colW = 48;
  const W = left + n*colW + 8;
  const H = top + rows.length*rowH + 8;
  const ticks = WEEKS.slice(0,n).map((w,i)=> i%2===0 ? `<text x="${left+i*colW+4}" y="14" font-size="9" fill="#5C6570">${w}</text>

  const bars = rows.map((r,i)=>{
    const y = top + i*rowH + 7;
    const segs = (r.bars || [{ start:r.start, dur:r.dur, label:r.label, risk:r.risk }])
      .filter(b => b.dur > 0 && b.start < n)
      .map(b => {
        const dur = Math.min(b.dur, n - b.start);
        const x = left + b.start*colW;
        const w = Math.max(dur*colW - 4, 8);
        const op = b.risk ? "0.45" : "0.82";
        return `<rect x="${x}" y="${y}" width="${w}" height="12" fill="#0B1C30" opacity="${op}"/>
          <text x="${x+4}" y="${y+10}" font-size="8" fill="#F4F1EA" font-weight="600">${esc(b.label||"")}</text>`;
      }).join("");
    return `<text x="0" y="${y+8}" font-size="11" fill="#0B1C30">${esc(r.name)}</text>${segs}`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" aria-label="${title}">${ticks}${bars}</svg>`;
}

function dealCommercial(d){
  if (!d || !d.lines || !d.lines.length) return null;
  const card = d.lines.reduce((a,l)=>a+l.card*l.qty,0);
  const quoted = d.lines.reduce((a,l)=>a+l.quoted*l.qty,0);
  const cost = d.lines.reduce((a,l)=>a+l.cost*l.qty,0);
  const qty = d.lines.filter(l=>l.sku==="PC-OUT"||l.sku==="PC-IN").reduce((a,l)=>a+l.qty,0) || d.lines[0].qty;
  return { card, quoted, cost, disc: card?1-quoted/card:0, gp: quoted-cost, gpPct: quoted?(quoted-cost)/quoted:0, qty };
}
function downloadBlob(name, text){

  const a = document.createElement("a");

function setHorizon(n){ horizon = n; persist(); renderAll(); show("install"); }
function crewClashes(){
  const out = [];
  CREW.forEach(person => {
    const hits = state.jobs.filter(j => j.crew.includes(person)).sort((a,b)=>a.start-b.start);
    for (let i=0;i<hits.length;i++){
      for (let j=i+1;j<hits.length;j++){
        if (hits[i].start + hits[i].dur > hits[j].start) out.push(person+" · "+hits[i].name+" overlaps "+hits[j].name);
      }
    }
  });
  return out;
}

      <div class="kpi"><div class="v">€${m.adr.toFixed(0)}</div><div class="l">Average rate achieved</div></div>
      <div class="kpi"><div class="v">€${m.revpach.toFixed(0)}</div><div class="l">RevPACH · available hour</div></div>
      <div class="kpi"><div class="v">${m.ppc.toFixed(1)}</div><div class="l">Players per used court</div></div>
      <div class="kpi ${m.staff>0.45?"warn":""}"><div class="v">${m.staff.toFixed(2)}</div><div class="l">FOH staff per used court</div></div>
    </div>
    <div class="paper">
      <h3>Utilisation · hour × day</h3>
      <p class="note">Ink is occupancy. Peak evenings 91–98%. Midweek mornings are the valley. Numbers are % of 8 courts booked that hour.</p>
      ${heatTable()}
    </div>
    <div class="row k2">
      <div class="paper">
        <h3>Utilisation by day</h3>
        <p class="note">Weekend mornings carry Saturday. Friday night is the cap. Implied court revenue this week ${eur(m.rev)}.</p>
        ${svgClubWeek(m.byDay)}
      </div>
      <div class="paper">
        <h3>Yield and labour</h3>
        <p class="note">RevPACH = utilisation × ADR. Staff ratio is FOH hours / booked court-hours. Coaches sit in academy GMV, not this denominator.</p>
        <table>
          <thead><tr><th></th><th>This week</th><th>Best-in-class read</th></tr></thead>
          <tbody>
            <tr><td>Court GMV / court / month</td><td>${eurk(m.gmvCourtMo)}</td><td>Playtomic top ~${eurk(c.playtomicTop)} global; hotspot flagship runs higher hours and rate</td></tr>
            <tr><td>Indoor vs outdoor util</td><td>${Math.round(c.indoorUtil*100)}% / ${Math.round(c.outdoorUtil*100)}%</td><td>Indoor coverage is the structural lever</td></tr>
            <tr><td>Court share of GMV</td><td>${Math.round(c.gmvMix.court*100)}%</td><td>Playtomic average 68% · academy and F&amp;B are the rest</td></tr>
            <tr><td>Labour % of sales</td><td>${Math.round(c.labourPct*100)}%</td><td>Hold 15–25%. Peak FOH should sit near 0.3–0.4 per occupied court</td></tr>
            <tr><td>Waitlist parties</td><td>${m.wait} / week</td><td>Unmet peak = add indoor hours, not cheaper 19:00 slots</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="band">Week · ${esc(c.name)}</div>
    <table>
      <thead><tr><th>Day</th><th>Util</th><th>Court revenue</th><th>ADR</th><th>Players / court</th><th>FOH / used court</th><th>Waitlist</th></tr></thead>
      <tbody>
        ${dayRows}
        <tr><td>Week</td><td>${Math.round(m.util*100)}%</td><td>${eur(m.rev)}</td><td>€${m.adr.toFixed(0)}</td><td>${m.ppc.toFixed(1)}</td><td>${m.staff.toFixed(2)}</td><td>${m.wait}</td></tr>
      </tbody>
    </table>
    <div class="band">Expansion · from this week’s demand shape</div>
    <div class="cols c4">${cards(c.expansion)}</div>`;
}

function renderAll(){
  renderRoad(); renderCommand(); renderTenders(); renderBlockers(); renderInstall(); renderForecast(); renderReport(); renderClub();
}
renderNav();
renderAll();
show("command");
</script>
</body>
</html>

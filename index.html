let listening = false, recHandle = null, openSheetData = null;
function routeVoice(text){
  const t = (text||"").toLowerCase();
  let account = "Unspecified", kind = "Client inbound", channel = "os", slackTo = "", raise = false;
  const names = [["site x","Site X"],["club g","Club G"],["club h","Club H"],["club b","Club B"],["club d","Club D"],["hotel f","Hotel F"],["operator a","Operator A"],["leisure","Leisure chain"],["local authority","Local authority"],["council","Council framework"]];
  names.forEach(([k,v])=>{ if (t.includes(k)) account = v; });
  if (/\bslack\b|ping |tell michael|tell paul|message the team|whatsapp the crew|message michael|message paul/.test(t)) {
    channel = "slack";
    slackTo = t.includes("paul") ? "#ops-paul" : t.includes("carys") ? "#ea-carys" : "#ops-michael";
  }
  if (/\bon site|install|crew|kit|manza|groundworks|window/.test(t)) kind = "Site update";
  if (/\bcall|they said|client|price|proposal|deposit/.test(t) && kind!=="Site update") kind = "Client inbound";
  if (/\bblock|stuck|overdue|unpaid|can't|cannot|isn't on site|not ordered|issue|problem/.test(t)) raise = true;
  const why = channel==="slack"
    ? (raise ? "Team ping plus a risk. Carys posts Slack, logs Activity, and raises a Blocker." : "Team ping. Carys posts Slack and logs Activity.")
    : (raise ? "Sounds like a blocker. Carys logs Activity and raises Blocker." : "Standard update. Carys logs Activity on the account.");
  return { account, kind, channel, slackTo, raise, why, text };
}
function startVoice(){
  if (listening && recHandle) { recHandle.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const box = el("voice-out");
  if (!SR) {
    if (box) box.style.display = "block";
    toast("Mic not in this browser — type it, or tap a sample");
    return;
  }
  const rec = new SR();
  recHandle = rec;
  rec.lang = "en-IE";
  rec.interimResults = true;
  rec.continuous = false;
  listening = true;
  const btn = el("voice-btn");
  if (btn) { btn.classList.add("live"); btn.textContent = "Listening… tap to stop"; }
  rec.onresult = e => {
    let said = "";
    for (let i=0;i<e.results.length;i++) said += e.results[i][0].transcript;
    const ta = el("v-said");
    if (ta) ta.value = said;
    if (e.results[e.results.length-1].isFinal) showRoute(said);
  };
  rec.onerror = () => { listening = false; if (btn) { btn.classList.remove("live"); btn.textContent = "Voice"; } toast("Mic didn't catch that — try again or type"); };
  rec.onend = () => { listening = false; recHandle = null; if (btn) { btn.classList.remove("live"); btn.textContent = "Voice"; } };
  rec.start();
}

  const r = routeVoice(text);

  hold.style.display = "block";

  hold.dataset.payload = JSON.stringify(r);
}

function sendCarys(){
  const hold = el("route-box");
  const ta = el("v-said");
  const typed = (ta && ta.value.trim()) || "";
  let r;
  try { r = JSON.parse(hold && hold.dataset.payload || "null"); } catch(e){ r = null; }
  if (!r) r = routeVoice(typed);
  if (typed) r.text = typed;
  if (!r.text) { toast("Say or type something first"); return; }
  state.inbox.unshift({
    id: Date.now(), when: "13 Aug", by: "Founder A",
    text: r.text, account: r.account, kind: r.kind, channel: r.channel,
    slackTo: r.slackTo, raise: r.raise, why: r.why, status: "With Carys"
  });
  persist(); toast("With Carys"); renderAll(); show("road");
}
function carysAct(id, how){
  const item = state.inbox.find(x => x.id===id);
  if (!item || item.status!=="With Carys") return;
  if (how==="log" || how==="slack" || how==="all") {
    state.calls.unshift({ t: item.account+" · "+item.kind, m: item.text, cls: item.raise?"red":"amber" });
  }
  if ((how==="blocker" || how==="all") && item.raise) {
    state.blockers.unshift({ id: Date.now(), t: item.account+" · from voice", m: item.text, type: item.kind==="Site update"?"Install":"Sales", sev: "Red", status: "Open", founder: true });
  }
  item.status = how==="slack" ? "Slack queued · logged" : how==="blocker" ? "Blocker raised" : how==="all" ? (item.channel==="slack"?"Slack + log + blocker":"Logged") : "Logged by Carys";
  persist(); toast(item.status); renderAll(); show("road");
}

function clubMetrics(){
  const c = state.club;
  const n = c.courts;
  let booked = 0, avail = 0, rev = 0, playerH = 0;
  const byDay = c.days.map((day, di) => {
    let b = 0, r = 0, p = 0;
    c.heat[di].forEach((u, hi) => {
      const hours = n * u / 100;
      b += hours;
      r += hours * c.rate[hi];
      p += hours * c.ppc[hi];
    });
    const a = n * c.hours.length;
    booked += b; avail += a; rev += r; playerH += p;
    const used = b;
    return {
      day, booked: b, avail: a, util: b / a, rev: r, adr: r / b,
      ppc: p / b, staff: c.fohHours[di] / used, wait: c.waitlist[di],
      coaches: c.coachHours[di] / used
    };
  });
  return {
    byDay,
    util: booked / avail,
    adr: rev / booked,
    revpach: rev / avail,
    ppc: playerH / booked,
    staff: c.fohHours.reduce((a,b)=>a+b,0) / booked,
    rev, booked, avail,
    wait: c.waitlist.reduce((a,b)=>a+b,0),
    gmvCourtMo: (rev * 52 / 12) / n
  };
}

function dealCommercial(d){
  if (!d || !d.lines || !d.lines.length) return null;
  const card = d.lines.reduce((a,l)=>a+l.card*l.qty,0);
  const quoted = d.lines.reduce((a,l)=>a+l.quoted*l.qty,0);
  const cost = d.lines.reduce((a,l)=>a+l.cost*l.qty,0);
  const qty = d.lines.filter(l=>l.sku==="PC-OUT"||l.sku==="PC-IN").reduce((a,l)=>a+l.qty,0) || d.lines[0].qty;
  return { card, quoted, cost, disc: card?1-quoted/card:0, gp: quoted-cost, gpPct: quoted?(quoted-cost)/quoted:0, qty };
}
function downloadBlob(name, text){
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 500);
}

function leadValue(l){ return l.courts * 46000; }
function leadWeight(l){
  if (l.path==="Tender") {
    if (l.tender==="Award") return 0.55;
    if (l.tender==="Secondary document out") return 0.45;
    if (l.tender==="Initial document out") return 0.25;
    if (l.tender==="Bid / no-bid") return 0.10;
    if (l.tender==="Qualifying") return 0.10;
    return 0.05;
  }
  if (l.qual==="Qualified") return 0.25;
  if (l.qual==="Qualifying") return 0.10;
  if (l.qual==="Conversation") return 0.05;
  return 0;
}

function setHorizon(n){ horizon = n; persist(); renderAll(); show("install"); }
function crewClashes(){
  const out = [];
  CREW.forEach(person => {
    const hits = state.jobs.filter(j => j.crew.includes(person)).sort((a,b)=>a.start-b.start);
    for (let i=0;i<hits.length;i++){
      for (let j=i+1;j<hits.length;j++){
        if (hits[i].start + hits[i].dur > hits[j].start) out.push(person+" · "+hits[i].name+" overlaps "+hits[j].name);
      }
    }
  });
  return out;
}

      <p class="note">Last six from Xero tracking categories. Next six: install windows + contracted maintenance + academy cohort + booked tour places + partner offset once the base is open. Repeat purchase (${v.repeatSites} of ${v.installed} sites) sits inside court install.</p>
      <table>
        <thead><tr><th>Stream</th><th>Last 6 months</th><th>Next 6 months</th><th>GM next</th><th>State</th></tr></thead>
        <tbody>
          ${streamRows}
          <tr><td>Total</td><td>${eurk(x.rev6)}</td><td>${eurk(x.rev6proj)}</td><td>${Math.round(x.gm6proj*100)}%</td><td>Gross profit next ${eurk(x.gp6proj)} · last ${Math.round(x.gm6*100)}%</td></tr>
        </tbody>
      </table>
    </div>
    <div class="band">Invoices to chase · ${eur(overdueSum)} overdue</div>
    <table>
      <thead><tr><th>Xero</th><th>Account</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead>
      <tbody>${chaseRows}</tbody>
    </table>
    <div class="band">Cash by month</div>
    <table>
      <thead><tr><th>Month</th><th></th><th>In</th><th>Out</th><th>Net</th><th>Close</th></tr></thead>
      <tbody>${cashRows}</tbody>
    </table>`;
}

function renderClub(){
  const c = state.club;
  const m = clubMetrics();
  const dayRows = m.byDay.map(d => `<tr>
    <td>${d.day}</td>
    <td>${Math.round(d.util*100)}%</td>
    <td>${eur(d.rev)}</td>
    <td>€${d.adr.toFixed(0)}</td>
    <td>${d.ppc.toFixed(1)}</td>
    <td>${d.staff.toFixed(2)}</td>
    <td>${d.wait ? d.wait : "—"}</td>
  </tr>`).join("");
  el("v-club").innerHTML = `
    ${kickerHtml("07","Owned club · "+c.weekOf,"club")}
    <h1>${esc(c.name)}<em>The court-hour engine. Not court count.</em></h1>
    <p class="sub">${c.courts} courts (${c.indoor} indoor). Open 08:00–22:00. Playtomic 2026: GMV = hours × utilisation × rate, or players per court × frequency × ticket. Top clubs beat the bottom 5× on that system, not on more courts. Ireland sits in the UK hotspot: peak is full; expand indoor, fill mornings with programming.</p>
    <div class="row k5">
      <div class="kpi"><div class="v">${Math.round(m.util*100)}%</div><div class="l">Utilisation · week</div></div>
      <div class="kpi"><div class="v">€${m.adr.toFixed(0)}</div><div class="l">Average rate achieved</div></div>
      <div class="kpi"><div class="v">€${m.revpach.toFixed(0)}</div><div class="l">RevPACH · available hour</div></div>
      <div class="kpi"><div class="v">${m.ppc.toFixed(1)}</div><div class="l">Players per used court</div></div>
      <div class="kpi ${m.staff>0.45?"warn":""}"><div class="v">${m.staff.toFixed(2)}</div><div class="l">FOH staff per used court</div></div>
    </div>
    <div class="paper">
      <h3>Utilisation · hour × day</h3>
      <p class="note">Ink is occupancy. Peak evenings 91–98%. Midweek mornings are the valley. Numbers are % of 8 courts booked that hour.</p>
      ${heatTable()}
    </div>
    <div class="row k2">
      <div class="paper">
        <h3>Utilisation by day</h3>
        <p class="note">Weekend mornings carry Saturday. Friday night is the cap. Implied court revenue this week ${eur(m.rev)}.</p>
        ${svgClubWeek(m.byDay)}
      </div>
      <div class="paper">
        <h3>Yield and labour</h3>
        <p class="note">RevPACH = utilisation × ADR. Staff ratio is FOH hours / booked court-hours. Coaches sit in academy GMV, not this denominator.</p>
        <table>
          <thead><tr><th></th><th>This week</th><th>Best-in-class read</th></tr></thead>
          <tbody>
            <tr><td>Court GMV / court / month</td><td>${eurk(m.gmvCourtMo)}</td><td>Playtomic top ~${eurk(c.playtomicTop)} global; hotspot flagship runs higher hours and rate</td></tr>
            <tr><td>Indoor vs outdoor util</td><td>${Math.round(c.indoorUtil*100)}% / ${Math.round(c.outdoorUtil*100)}%</td><td>Indoor coverage is the structural lever</td></tr>
            <tr><td>Court share of GMV</td><td>${Math.round(c.gmvMix.court*100)}%</td><td>Playtomic average 68% · academy and F&amp;B are the rest</td></tr>
            <tr><td>Labour % of sales</td><td>${Math.round(c.labourPct*100)}%</td><td>Hold 15–25%. Peak FOH should sit near 0.3–0.4 per occupied court</td></tr>
            <tr><td>Waitlist parties</td><td>${m.wait} / week</td><td>Unmet peak = add indoor hours, not cheaper 19:00 slots</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="band">Week · ${esc(c.name)}</div>
    <table>
      <thead><tr><th>Day</th><th>Util</th><th>Court revenue</th><th>ADR</th><th>Players / court</th><th>FOH / used court</th><th>Waitlist</th></tr></thead>
      <tbody>
        ${dayRows}
        <tr><td>Week</td><td>${Math.round(m.util*100)}%</td><td>${eur(m.rev)}</td><td>€${m.adr.toFixed(0)}</td><td>${m.ppc.toFixed(1)}</td><td>${m.staff.toFixed(2)}</td><td>${m.wait}</td></tr>
      </tbody>
    </table>
    <div class="band">Expansion · from this week’s demand shape</div>
    <div class="cols c4">${cards(c.expansion)}</div>`;
}

function renderAll(){
  [renderRoad, renderCommand, renderLeads, renderTenders, renderBlockers, renderInstall, renderForecast, renderReport, renderClub].forEach(fn => {
    try { fn(); } catch (err) { console.error(err); }
  });
  wrapScrollX(document.querySelector("main"));
}
renderNav();
el("tabs").addEventListener("click", onNavClick);
renderAll();
bindKeyboard();
show(isPhone() ? "road" : "command");
</script>
</body>
</html>
